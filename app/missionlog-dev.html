<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MISSION LOG — dev harness</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b0e14; }
      body { display: flex; gap: 16px; padding: 16px; box-sizing: border-box; height: 100vh; }
      #panel-host { height: 100%; display: flex; }
      #controls {
        font: 12px/1.6 ui-monospace, Consolas, monospace; color: #d5dbe8;
        display: flex; flex-direction: column; gap: 10px; max-width: 420px;
      }
      #controls .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      #controls button, #controls select {
        font: 11px ui-monospace, Consolas, monospace; font-weight: 700;
        color: #d5dbe8; background: #1a2030; border: 1px solid #3a4358;
        border-radius: 5px; padding: 3px 10px; cursor: pointer;
      }
      #meta, #driven, #determinism {
        color: #8a93a8; font-size: 11px; white-space: pre-wrap; word-break: break-word;
        border: 1px solid #2a3142; border-radius: 6px; padding: 8px 10px;
        background: rgba(10, 13, 20, 0.88);
      }
      #driven b { color: #5fa8ff; }
      #determinism.ok { color: #34d975; }
      #determinism.bad { color: #ff453a; }
    </style>
  </head>
  <body>
    <div id="panel-host"></div>
    <div id="controls"></div>
    <script type="module" src="/src/missionLogDev.ts"></script>
  </body>
</html>
