<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surveyor Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
      #app { position: fixed; inset: 0; }
      #hud {
        display: none; /* dev-only: the D key toggles it (persisted) */
        position: fixed; top: 10px; left: 10px; z-index: 10;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        color: #d5dbe8; background: rgba(10, 13, 20, 0.78);
        border: 1px solid #2a3142; border-radius: 6px;
        padding: 8px 12px; white-space: pre; pointer-events: none;
        min-width: 240px;
      }
      #hud .big { font-size: 16px; font-weight: 700; }
      #hud .ok { color: #6fe3a1; }
      #hud .warn { color: #ffd166; }
      #hud .bad { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
